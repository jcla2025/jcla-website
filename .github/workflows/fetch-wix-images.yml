name: 旧Wixサイトの写真を取り込む
on:
  push:
    paths: ["tools/wix-images.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p src/wix-originals
          while read -r name id; do
            [ -z "$name" ] && continue
            ext="${id##*.}"
            curl -fsSL "https://static.wixstatic.com/media/$id" -o "src/wix-originals/$name.$ext" || echo "failed $name"
          done < tools/wix-images.txt
          ls -la src/wix-originals
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add src/wix-originals
          git diff --cached --quiet || git commit -m "旧Wixサイトの写真を取り込み"
          git push
